<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud recibida · Informática Q Aluche</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
         background:#f8f9fa;display:flex;align-items:center;justify-content:center;
         min-height:100vh;padding:20px}
    .box{text-align:center;max-width:440px}
    .check{width:80px;height:80px;border-radius:50%;background:#f0fdf4;
          border:3px solid #22c55e;display:flex;align-items:center;justify-content:center;
          margin:0 auto 24px;animation:popIn 0.4s ease-out}
    @keyframes popIn{from{transform:scale(0)}60%{transform:scale(1.15)}to{transform:scale(1)}}
    .check svg{width:40px;height:40px;stroke:#22c55e;stroke-width:3;fill:none;
               stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;
               animation:draw 0.5s 0.2s ease-out forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    h1{font-size:1.4rem;font-weight:800;color:#1a1a2e;margin-bottom:10px}
    p{font-size:0.95rem;color:#6c757d;line-height:1.7;margin-bottom:20px}
    a{display:inline-block;background:#1a1a2e;color:#fff;padding:14px 32px;
       border-radius:12px;font-weight:700;text-decoration:none;font-size:1rem}
  </style>
</head>
<body>
  <div class="box">
    <div class="check">
      <svg viewBox="0 0 40 40"><polyline points="10 20 18 28 30 12"/></svg>
    </div>
    <h1>¡Solicitud recibida!</h1>
    <p>Hemos registrado tu reserva correctamente.<br>Te contactaremos pronto para confirmar tu plaza.</p>
    <a href="index.html">Volver al inicio</a>
  </div>
</body>
</html>
